name: 抓取行情并更新台账

on:
  # 每 30 分钟跑一次。GitHub 用的是 UTC，对本项目无影响——归档按交易日而非钟点。
  #
  # 2026-11-27 复核：原来设 */10，实测被平台大量丢弃——11-26 只跑了 04:00–05:29
  # 一段和 15:40 一次，11-27 全天只有 00:04 一次（北京 08:04）。排得越密，
  # 被丢的比例越高，反而更不准。本项目的归档只需要「日线每天一根」，
  # 盘中细节由页面直连日线接口自己补（见 docs/spread.html 的 pullKline），
  # 所以降到 */30：attempt 少了，单次被执行的概率反而更高。
  #
  # 若要真正的分钟级准时，走 cf-cron 那个 Cloudflare Worker（每 5 分钟 dispatch
  # 本工作流），需要先配一个只含本仓库 Actions:write 的 GitHub Token，
  # 步骤见 cf-cron/README.md。没配之前它不会生效，别指望它。
  schedule:
    - cron: '*/30 * * * *'

  # 允许在网页上手动点一下立即运行，首次部署时用来验证
  workflow_dispatch:

  # 第一次推送代码时也跑一次，让页面立刻有数据
  push:
    branches: [main, master]

# 提交数据需要写权限；其余权限一律不给
permissions:
  contents: write

# 同一时间只允许一个抓取任务，避免两次运行同时改文件造成冲突
concurrency:
  group: scrape-market-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取行情并归档
        run: node scripts/scrape.js

      - name: 提交数据变更
        # 即使上一步以失败退出（落后报警），也要把已经取到的数据提交上去，
        # 否则数据卡在 runner 里白跑一趟；任务最终仍标记为失败，好触发通知。
        if: always()
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "data: 更新行情台账 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 万一远端在此期间被改过，先变基再推，避免一次无谓的失败
            git push || { git pull --rebase --autostash && git push; }
          else
            echo "数据无变化，跳过提交"
          fi
